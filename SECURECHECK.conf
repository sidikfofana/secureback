<VirtualHost *:80>
    ServerAdmin admin@securecheck.info
    ServerName securecheck.info
    ServerAlias www.securecheck.info
    DocumentRoot /var/www/html/securecheck.info

    <Directory /var/www/html/securecheck.info>
        AllowOverride All
        Require all granted
        Options FollowSymLinks
    </Directory>

     # Configuration des CORS
    <IfModule mod_headers.c>
        Header set Access-Control-Allow-Origin "https://www.securecheck.info"
        Header set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
        Header set Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With"
        Header set Access-Control-Allow-Credentials "true"
        
        # Pré-vol CORS pour les requêtes OPTIONS
        RewriteEngine On
        RewriteCond %{REQUEST_METHOD} OPTIONS
        RewriteRule ^(.*)$ $1 [L,R=200]
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
